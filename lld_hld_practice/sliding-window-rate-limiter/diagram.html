<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Window Rate Limiter — Diagram</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 24px; background: #fff; color: #1a1a1a; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
  p { font-size: 13px; color: #666; margin-top: 0; }
  svg { width: 100%; height: auto; display: block; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #e0e0e0; }
    p { color: #999; }
  }
</style>
</head>
<body>
<h1>Sliding Window Rate Limiter — Mental Model</h1>
<p>Log-based · Redis ZSET · Lua script atomicity · L5 EM level</p>
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- DOMAIN section -->
  <rect x="10" y="10" width="880" height="26" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="450" y="27" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">Domain</text>

  <rect x="10" y="46" width="130" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="75" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">Actor</text>
  <text x="75" y="78" text-anchor="middle" font-size="10" fill="#534AB7">Devices · IPs · Users</text>

  <rect x="152" y="46" width="180" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="242" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">Configuration</text>
  <text x="242" y="78" text-anchor="middle" font-size="10" fill="#534AB7">windowSize · threshold · scope</text>

  <rect x="344" y="46" width="200" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="444" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">State</text>
  <text x="444" y="78" text-anchor="middle" font-size="10" fill="#534AB7">HashMap&lt;userId, Deque&lt;Long&gt;&gt;</text>

  <rect x="556" y="46" width="334" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="723" y="62" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">Transitions</text>
  <text x="723" y="78" text-anchor="middle" font-size="10" fill="#534AB7">prune head → check size → addLast(now)</text>

  <!-- HLD section -->
  <rect x="10" y="100" width="880" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="450" y="117" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">HLD</text>

  <!-- Components flow -->
  <rect x="10" y="136" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="158" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Client</text>

  <line x1="110" y1="154" x2="148" y2="154" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="150" y="136" width="130" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="215" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">API Gateway</text>
  <text x="215" y="166" text-anchor="middle" font-size="9" fill="#0F6E56">L1 IP limit + Auth</text>

  <line x1="280" y1="154" x2="318" y2="154" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="320" y="136" width="110" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="375" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Load Balancer</text>
  <text x="375" y="166" text-anchor="middle" font-size="9" fill="#0F6E56">distributes traffic</text>

  <line x1="430" y1="154" x2="468" y2="154" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="470" y="136" width="140" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="540" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Rate Limiter</text>
  <text x="540" y="166" text-anchor="middle" font-size="9" fill="#0F6E56">stateless · L2 userId limit</text>

  <line x1="610" y1="154" x2="648" y2="154" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="650" y="136" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="700" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Redis ZSET</text>
  <text x="700" y="166" text-anchor="middle" font-size="9" fill="#0F6E56">Lua script atomic</text>

  <line x1="750" y1="154" x2="788" y2="154" stroke="#888" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="790" y="136" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="840" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#085041">Downstream</text>
  <text x="840" y="166" text-anchor="middle" font-size="9" fill="#0F6E56">Path 1 only</text>

  <!-- 3 paths -->
  <rect x="10" y="184" width="880" height="80" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="22" y="202" font-size="12" font-weight="500" fill="#085041">End-to-End Paths</text>
  <text x="22" y="220" font-size="11" fill="#0F6E56">✓  Path 1 (allow):     Gateway → Auth → LB → Rate Limiter → Lua=1 → Downstream → 200 OK</text>
  <text x="22" y="238" font-size="11" fill="#0F6E56">✗  Path 2 (block):     Lua=0 → count ≥ threshold → 429 + Retry-After  (never hits downstream)</text>
  <text x="22" y="256" font-size="11" fill="#0F6E56">⚠  Path 3 (Redis down): catch exception → fail open → allow → fire alert → ops recovers</text>

  <!-- LLD section -->
  <rect x="10" y="278" width="880" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="450" y="295" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">LLD</text>

  <rect x="10" y="314" width="420" height="80" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="220" y="332" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">Algorithm — allowRequest(userId)</text>
  <text x="22" y="350" font-size="10" fill="#185FA5">1. queue == null → init Deque, addLast(now), return true</text>
  <text x="22" y="366" font-size="10" fill="#185FA5">2. while peekFirst() &lt;= now − windowSize → pollFirst()  (prune stale)</text>
  <text x="22" y="382" font-size="10" fill="#185FA5">3. size() &gt;= threshold → false  |  else → addLast(now), true</text>

  <rect x="442" y="314" width="448" height="80" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="666" y="332" text-anchor="middle" font-size="12" font-weight="500" fill="#0C447C">Thread safety — production</text>
  <text x="454" y="350" font-size="10" fill="#185FA5">Local: ConcurrentHashMap.compute() wraps prune+check+add atomically</text>
  <text x="454" y="366" font-size="10" fill="#185FA5">Distributed: Redis Lua script — ZREMRANGEBYSCORE + ZCARD + ZADD</text>
  <text x="454" y="382" font-size="10" fill="#185FA5">Rule: atomic data layer, not pod-per-user (operational nightmare)</text>

  <!-- API section -->
  <rect x="10" y="408" width="880" height="26" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="450" y="425" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">API Design</text>

  <rect x="10" y="444" width="420" height="70" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="220" y="462" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">POST /ratelimit/{entityId}</text>
  <text x="22" y="480" font-size="10" fill="#854F0B">Body: { endpoint: string }   entityId = userId from JWT</text>
  <text x="22" y="496" font-size="10" fill="#854F0B">Headers: X-RateLimit-Limit · Remaining · Reset · Retry-After(429)</text>

  <rect x="442" y="444" width="448" height="70" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="666" y="462" text-anchor="middle" font-size="12" font-weight="500" fill="#633806">Responses</text>
  <text x="454" y="480" font-size="10" fill="#854F0B">200: { allowed:true, remaining:N, windowResetAt:null }  ← null: no fixed reset</text>
  <text x="454" y="496" font-size="10" fill="#854F0B">429: { allowed:false, retryAfter:N }   500: { allowed:true, reason:unavailable }</text>

  <!-- PRODUCTION section -->
  <rect x="10" y="528" width="880" height="26" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="450" y="545" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">Production</text>

  <rect x="10" y="564" width="420" height="46" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="220" y="582" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">Failures</text>
  <text x="22" y="600" font-size="10" fill="#993C1D">Redis down → fail open · Replica lag → over-count ok · Queue bloat → alert ZCARD</text>

  <rect x="442" y="564" width="448" height="46" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="666" y="582" text-anchor="middle" font-size="12" font-weight="500" fill="#712B13">Observability</text>
  <text x="454" y="600" font-size="10" fill="#993C1D">Splunk: 429 · fail-open events   CloudWatch: Redis latency · ZCARD · RPS</text>
</svg>
</body>
</html>
